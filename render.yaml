services:
  # ── Backend (Node.js / Express) ──────────────────────────────────────────────
  - type: web
    name: pro-me-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # задаётся вручную в Render Dashboard
      - key: SESSION_SECRET
        sync: false          # задаётся вручную в Render Dashboard
      - key: CLIENT_ORIGIN
        sync: false          # задаётся вручную: URL задеплоенного фронтенда

  # ── Frontend (React / Vite → Static Site) ────────────────────────────────────
  - type: web
    name: pro-me-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # задаётся вручную: https://<pro-me-backend>.onrender.com/api

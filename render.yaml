# Pro.me — один веб-сервис: Express отдаёт и API, и собранный фронтенд.
#
# Раньше здесь было два сервиса на двух поддоменах onrender.com. onrender.com
# входит в Public Suffix List, поэтому это два разных сайта, и сессионная кука
# становилась сторонней. Safari (то есть все iPhone) блокирует сторонние куки
# полностью — вход бы не работал у большой части мобильных пользователей.
# Один источник (origin) — единственная схема, которая работает везде.

services:
  - type: web
    name: pro-me
    runtime: node

    # Без явного plan Render создаёт сервис на ПЛАТНОМ тарифе (0.5c-512mb).
    plan: free

    # По умолчанию oregon (США), и после создания регион поменять нельзя.
    # Роадмап требует хостинг в ЕС из-за GDPR. Кластер Atlas — тоже во Франкфурте.
    region: frankfurt

    # Сборка фронтенда, затем production-зависимости бэкенда.
    # Скрипты лежат в корневом package.json.
    buildCommand: npm run build
    startCommand: npm start

    # Отвечает 200 только при живом подключении к базе.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Строка подключения из Atlas. Вводится вручную при создании Blueprint.
      - key: MONGO_URI
        sync: false

      # Render сам сгенерирует случайный 256-битный секрет.
      - key: SESSION_SECRET
        generateValue: true

      # PORT и RENDER_EXTERNAL_URL Render выставляет сам.
